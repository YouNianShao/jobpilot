# JobPilot 配置示例 —— 复制为 config.yaml 后修改

browser:
  # 你已登录的 Chrome 调试端口（用 --remote-debugging-port 启动）
  cdp_url: http://127.0.0.1:9223

ai:
  provider: deepseek      # deepseek / doubao / qwen / glm / kimi / siliconflow / openai / anthropic / gemini / custom
  base_url: https://api.deepseek.com/v1
  model: deepseek-flash
  api_key: sk-xxxx
  timeout_seconds: 30
  max_attempts: 2

profile:
  resume_path: ./data/resume.md
  salary_min: 0        # K/月，0=不限
  salary_max: 0        # K/月，0=不限
  allow_internship: false
  deal_breakers: []    # 职位名黑名单
  greeting_preference: ""   # 招呼语偏好（可选）

platforms:
  boss:
    enabled: true
    cities: [上海]
    keywords: [AI, 数据分析]
    max_pages: 3
    apply: false        # BOSS 投递尚未实机核验，暂只采集
    fetch_detail: true  # BOSS 列表页没有薪资也没有 JD，只有详情页有；每岗占一次详情页预算
  51job:
    enabled: true
    cities: [上海]
    keywords: [AI, 数据分析]
    max_pages: 3
    apply: true
  liepin:
    enabled: true
    cities: [上海]
    keywords: [AI, 数据分析]
    max_pages: 3
    apply: true
  zhaopin:
    enabled: true
    cities: [上海]
    keywords: [AI, 数据分析]
    max_pages: 3
    apply: false        # 智联仅采集，投递请手动

scoring:
  threshold: 60
  concurrency: 1        # AI 评分并发 1-3

confirm:
  required: true        # 评分通过后需人工确认才投递

greeting:
  enabled: true         # 自动生成招呼语

apply:
  daily_limit: 30       # 每日投递上限
  interval_min: 60      # 两次投递最短间隔（秒）
  interval_max: 180     # 最长间隔（秒）
  max_consecutive_failures: 3

monitor:
  enabled: true
  auto: false           # 后台定时监测
  interval_minutes: 30
  working_hours: "09:00-21:00"

server:
  host: 127.0.0.1
  port: 8700
  # 看板页面全部关闭后闲置多少分钟自动退出服务（0 = 常驻不退出）
  # 有任务在跑时不会退出
  idle_shutdown_minutes: 2

safety:
  # 每平台覆盖（只写要覆盖的字段，其余继承下面的全局默认）
  # BOSS 反爬最强，默认就更保守：40 搜索页 / 200 详情页 / 2.0 倍间隔 / 60 分钟冷却
  platforms:
    boss:
      daily_pages:
        collect_search: 40
        collect_detail: 200
        apply: 30
        monitor: 30
        total: 300
      delay_multiplier: 2.0
      risk_lock_minutes: 60
  # 每平台每日"打开页面"预算（账号级防封号硬约束）
  daily_pages:
    collect_search: 60
    collect_detail: 300
    apply: 60
    monitor: 40
    total: 500
  send_windows: ["08:00-22:00"]   # 只在时间段内投递
  day_off_probability: 0.05       # 随机休息日
  risk_lock_minutes: 30           # 命中验证码/限流后的冷却分钟